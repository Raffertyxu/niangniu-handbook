<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0d0c">
<title>酿牛熟成學院</title>
<meta name="description" content="闖關學會酿牛和生活文，最後挑戰熟成大考。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&text=%E9%85%BF&display=swap" rel="stylesheet">
<style>
:root{
  --k:#0e0d0c; --k2:#1c1a18; --k3:#2c2925; --w:#f4f1ea; --w2:#e6e0d4; --mute:#8d867c;
  --o:#eb4d00; --o-d:#a93700;
  --font:"Noto Sans TC","Noto Sans SC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --num:"Anton","Noto Sans TC",sans-serif;
  --cut:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{min-height:100%}
body{font-family:var(--font);background:var(--k);color:var(--w);overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100svh;overflow-x:clip;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 18px calc(env(safe-area-inset-bottom) + 20px);position:relative}
.screen{display:none;flex:1;flex-direction:column;position:relative;z-index:1}
.screen.on{display:flex}

/* 背景斜切色塊（純色） */
.slab{position:fixed;z-index:0;background:var(--o);pointer-events:none;transition:clip-path .6s cubic-bezier(.7,0,.2,1)}
.slab{inset:0;clip-path:polygon(0 0,100% 0,100% 18%,0 34%)}
body[data-s="sMap"] .slab{clip-path:polygon(0 0,100% 0,100% 6%,0 14%)}
body[data-s="sLearn"] .slab,body[data-s="sQuiz"] .slab{clip-path:polygon(0 0,100% 0,100% 4%,0 9%)}
body[data-s="sStage"] .slab,body[data-s="sFinal"] .slab{clip-path:polygon(0 0,100% 0,100% 30%,0 20%)}

/* 轉場：斜切橘色刷過 */
.wipe{position:fixed;inset:-10% -60%;z-index:50;pointer-events:none;background:var(--o);transform:translateX(-120%) skewX(-18deg)}
.wipe::after{content:"";position:absolute;inset:0 0 0 auto;width:22%;background:var(--k)}
.wipe.go{animation:wipe .62s cubic-bezier(.75,0,.25,1)}
@keyframes wipe{0%{transform:translateX(-120%) skewX(-18deg)}100%{transform:translateX(120%) skewX(-18deg)}}

/* 共用元件 */
.top{display:flex;align-items:center;gap:10px;padding:16px 0 12px}
.grow{flex:1}
.tbtn{height:40px;min-width:40px;padding:0 12px;background:var(--k);color:var(--w);border:2px solid var(--w);font-weight:900;font-size:15px;display:grid;place-items:center;transition:transform .1s}
.tbtn:active{transform:translate(2px,2px)}
.tag{display:inline-block;background:var(--k);color:var(--w);font-weight:900;font-size:13px;letter-spacing:.12em;padding:5px 12px;transform:skewX(-10deg)}
.tag>span{display:inline-block;transform:skewX(10deg)}
.tag.o{background:var(--o)}
.tag.w{background:var(--w);color:var(--k)}
.btn{display:block;width:100%;position:relative;background:var(--w);color:var(--k);font-weight:900;font-size:20px;letter-spacing:.06em;padding:18px 20px;
  box-shadow:6px 6px 0 var(--o);transition:transform .08s,box-shadow .08s;clip-path:none}
.btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--o)}
.btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--o)}
.btn.o{background:var(--o);color:var(--w);box-shadow:6px 6px 0 var(--w)}
.btn.o:hover{box-shadow:8px 8px 0 var(--w)}
.btn.o:active{box-shadow:2px 2px 0 var(--w)}
.btn.line{background:var(--k);color:var(--w);border:2px solid var(--w);box-shadow:6px 6px 0 var(--k3)}
.btn+.btn{margin-top:18px}
.btn .arr{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-family:var(--num);font-size:22px}

/* 進場動畫 */
.in1,.in2,.in3,.in4,.in5,.in6{animation:slideIn .5s cubic-bezier(.2,.8,.2,1) both}
.in2{animation-delay:.06s}.in3{animation-delay:.12s}.in4{animation-delay:.18s}.in5{animation-delay:.24s}.in6{animation-delay:.3s}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}

/* 首頁 */
.home{padding-top:6vh}
.seal{width:118px;height:118px;border:6px solid var(--k);color:var(--k);display:grid;place-items:center;transform:rotate(-8deg);position:relative;background:var(--w);animation:sealIn .7s cubic-bezier(.2,1.6,.4,1) both}
.seal::before{content:"";position:absolute;inset:6px;border:2px solid var(--k)}
.seal b{font-size:64px;font-weight:900;line-height:1}
@keyframes sealIn{from{transform:rotate(-30deg) scale(2.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.home h1{margin-top:14vh;line-height:1}
.home h1 .a{display:block;font-size:76px;font-weight:900;letter-spacing:.02em}
.home h1 .b{display:inline-block;margin-top:14px;background:var(--o);color:var(--w);font-size:40px;font-weight:900;padding:6px 16px 8px;transform:rotate(-3deg) skewX(-8deg)}
.home .lead{font-size:18px;line-height:1.75;color:var(--w2);margin:26px 0 30px}
.home .lead b{color:var(--w);box-shadow:inset 0 -.38em 0 var(--o-d)}
.namebox{display:flex;align-items:center;border:2px solid var(--w);margin-bottom:22px}
.namebox label{background:var(--w);color:var(--k);font-weight:900;font-size:15px;padding:14px 14px;white-space:nowrap;letter-spacing:.08em}
.namebox input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--w);font:inherit;font-size:18px;font-weight:700;padding:12px 14px}
.namebox input::placeholder{color:var(--mute)}
.homefoot{margin-top:24px;font-size:14px;color:var(--mute)}

/* 挑戰者 */
.pickttl{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.linkbtn{font-size:14px;font-weight:900;color:var(--w);border-bottom:2px solid var(--o);padding:2px 0}
.players{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.pcard{position:relative;background:var(--k2);border:2px solid var(--k3);padding:12px 8px 10px;text-align:center;overflow:hidden;transition:transform .1s,border-color .15s,background .15s}
.pcard:hover{border-color:var(--w)}
.pcard:active{transform:scale(.96)}
.pcard .ini{display:block;font-family:var(--num);font-size:40px;line-height:1;color:transparent;-webkit-text-stroke:2px var(--w)}
.pcard .nm{display:block;font-weight:900;font-size:15px;margin-top:6px;letter-spacing:.04em}
.pcard .pr{display:block;font-size:11px;font-weight:700;color:var(--mute);margin-top:2px}
.pcard.on{background:var(--o);border-color:var(--o);transform:rotate(-2deg) scale(1.04)}
.pcard.on .ini{-webkit-text-stroke:0;color:var(--w)}
.pcard.on .pr{color:var(--k)}
.pcard.on::after{content:"✓";position:absolute;top:4px;right:6px;font-weight:900;font-size:14px;color:var(--k)}
.btn:disabled{opacity:.4;pointer-events:none}

/* 排行榜 */
.board{display:flex;flex-direction:column;gap:10px}
.brow{display:flex;align-items:center;gap:14px;background:var(--k2);border:2px solid var(--k3);padding:12px 16px 12px 0;animation:slideIn .45s cubic-bezier(.2,.8,.2,1) both}
.brow .pos{font-family:var(--num);font-size:46px;line-height:.9;width:64px;text-align:center;flex:none;color:transparent;-webkit-text-stroke:2px var(--w)}
.brow .who{flex:1;min-width:0}
.brow .who b{display:block;font-size:20px;font-weight:900}
.brow .who span{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.brow .pts{text-align:right;font-family:var(--num);font-size:32px;line-height:1}
.brow .pts small{display:block;font-family:var(--font);font-size:11px;font-weight:900;color:var(--mute);letter-spacing:.1em}
.brow.first{background:var(--o);border-color:var(--o)}
.brow.first .pos{-webkit-text-stroke:0;color:var(--w)}
.brow.first .who span,.brow.first .pts small{color:var(--k)}
.brow.me{border-color:var(--w)}
.brow.none{opacity:.45}
.boardnote{font-size:14px;color:var(--mute);line-height:1.7;margin:18px 0 24px}

/* 地圖 */
.mapttl{display:flex;align-items:flex-end;justify-content:space-between;margin:10px 0 18px}
.mapttl h2{font-size:34px;font-weight:900;line-height:1.15}
.mapttl h2 small{display:inline-block;font-size:14px;background:var(--k);color:var(--w);font-weight:900;padding:3px 10px;margin-bottom:8px;letter-spacing:.06em}
.aging{background:var(--w);color:var(--k);padding:18px 18px 16px;margin-bottom:26px;clip-path:var(--cut)}
.aging .row{display:flex;justify-content:space-between;align-items:flex-end}
.aging .lbl{font-size:14px;font-weight:900;letter-spacing:.1em}
.aging .rank{font-size:20px;font-weight:900;margin-top:2px}
.aging .day{font-family:var(--num);font-size:56px;line-height:.9;color:var(--o)}
.aging .day small{font-family:var(--font);font-size:16px;font-weight:900;color:var(--k);margin-left:4px}
.cells{display:grid;grid-template-columns:repeat(28,1fr);gap:3px;margin-top:14px}
.cells i{height:16px;background:var(--w2);transform:skewX(-14deg);transition:background .2s}
.cells i.on{background:var(--o)}
.cells i.on:nth-child(7n){background:var(--k)}
.daymarks{display:flex;justify-content:space-between;font-family:var(--num);font-size:12px;color:var(--mute);margin-top:6px}
.path{display:flex;flex-direction:column;gap:14px;padding-bottom:24px}
.stage{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--k2);border:2px solid var(--k3);padding:14px 16px 14px 0;position:relative;overflow:hidden;transition:transform .12s,background .12s,border-color .12s}
.stage:hover{transform:translateX(6px);border-color:var(--w)}
.stage:active{transform:translateX(2px) scale(.99)}
.stage .n{font-family:var(--num);font-size:64px;line-height:.85;width:84px;text-align:center;flex:none;color:transparent;-webkit-text-stroke:2px var(--w);margin-left:-4px}
.stage .t{flex:1;min-width:0}
.stage .no{font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--o)}
.stage .tt{display:block;font-size:20px;font-weight:900;line-height:1.3}
.stage .st{display:block;font-size:14px;color:var(--mute);margin-top:2px}
.stage .stars{font-size:18px;letter-spacing:2px;color:var(--o);flex:none}
.stage .stars s{text-decoration:none;color:var(--k3)}
.stage.locked{opacity:.38}
.stage.locked .stars{font-size:12px;font-weight:900;letter-spacing:.1em;color:var(--mute)}
.stage.next{background:var(--o);border-color:var(--o)}
.stage.next .n{-webkit-text-stroke:0;color:var(--w)}
.stage.next .no{color:var(--k)}
.stage.next .st{color:var(--w)}
.stage.next .stars s{color:var(--o-d)}
.stage.next::after{content:"NEXT";position:absolute;right:-30px;top:10px;background:var(--k);color:var(--w);font-family:var(--num);font-size:13px;letter-spacing:.1em;padding:2px 34px;transform:rotate(35deg)}
.stage.final{background:var(--w);border-color:var(--w);color:var(--k)}
.stage.final .n{-webkit-text-stroke:2px var(--k);font-size:52px}
.stage.final .st{color:var(--k)}

/* 學習卡 */
.bars{display:flex;gap:5px;flex:1}
.bars i{flex:1;height:8px;background:var(--k3);transform:skewX(-20deg)}
.bars i.on{background:var(--w)}
.bars i.cur{background:var(--o)}
.learn{flex:1;display:flex;flex-direction:column}
.lcard{flex:1;background:var(--w);color:var(--k);padding:26px 22px 24px;clip-path:var(--cut);display:flex;flex-direction:column;position:relative;animation:cardIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{from{opacity:0;transform:translateX(60px) rotate(2deg)}to{opacity:1;transform:none}}
.lcard .pg{position:absolute;right:18px;top:12px;font-family:var(--num);font-size:64px;line-height:1;color:transparent;-webkit-text-stroke:2px var(--w2)}
.lcard .tag{align-self:flex-start;margin-bottom:16px}
.lcard h3{font-size:30px;font-weight:900;line-height:1.35;margin-bottom:18px;position:relative}
.lcard h3 mark{background:none;color:inherit;box-shadow:inset 0 -.36em 0 rgba(235,77,0,.45)}
.lcard .body{font-size:18px;line-height:1.85;color:#3c3732}
.lcard .body b{color:var(--k);font-weight:900}
.lcard .facts{display:grid;gap:8px}
.lcard .facts div{display:flex;align-items:center;gap:14px;background:var(--k);color:var(--w);padding:12px 16px}
.lcard .facts div span:first-child{display:none}
.lcard .facts div span:last-child{flex:1;min-width:0;font-size:17px;font-weight:700;line-height:1.5}
.lcard .facts div b{display:block;font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--o)}
.lcard .duo{display:grid;gap:10px}
.lcard .duo div{padding:14px 16px;font-size:17px;line-height:1.6;position:relative}
.lcard .duo .no{background:var(--w2);color:var(--mute);text-decoration:line-through;text-decoration-color:var(--o)}
.lcard .duo .ok{background:var(--k);color:var(--w);font-weight:700}
.lcard .duo div::before{display:block;font-size:12px;font-weight:900;letter-spacing:.14em;margin-bottom:4px;text-decoration:none}
.lcard .duo .no::before{content:"✕ 不要這樣";color:var(--k)}
.lcard .duo .ok::before{content:"○ 這樣寫";color:var(--o)}
.lcard .post{border:2px solid var(--k);padding:16px 18px;white-space:pre-line;font-size:17px;line-height:1.8;position:relative}
.lcard .post::before{content:"貼文範例";position:absolute;top:-11px;left:14px;background:var(--w);padding:0 6px;font-size:12px;font-weight:900;letter-spacing:.12em}
.lcard .tip{margin-top:auto;padding-top:18px;font-size:15px;line-height:1.65;color:#5b544c;display:flex;gap:10px}
.lcard .tip::before{content:"TIP";font-family:var(--num);font-size:14px;background:var(--o);color:var(--w);padding:1px 7px;height:fit-content;letter-spacing:.06em}
.learnnav{display:flex;gap:16px;margin-top:22px}
.learnnav .btn{flex:1}
.learnnav .back{flex:0 0 64px;padding:18px 0;margin:0}

/* 題目 */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qnum{font-family:var(--num);font-size:40px;line-height:1}
.qnum small{font-size:18px;color:var(--mute)}
.combo{font-family:var(--num);font-size:18px;letter-spacing:.06em;background:var(--o);color:var(--w);padding:2px 10px;transform:skewX(-10deg) scale(0);transition:transform .25s cubic-bezier(.2,1.8,.4,1)}
.combo.show{transform:skewX(-10deg) scale(1)}
.score{margin-left:auto;text-align:right;font-family:var(--num);font-size:30px;line-height:1}
.score small{display:block;font-family:var(--font);font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--mute)}
.timer{position:relative;width:54px;height:54px;flex:none}
.timer svg{transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:7}
.timer .tb{stroke:var(--k3)}
.timer .tf{stroke:var(--w);transition:stroke-dashoffset 1s linear}
.timer.low .tf{stroke:var(--o)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--num);font-size:22px}
.timer.low b{color:var(--o);animation:beat .5s infinite}
@keyframes beat{50%{transform:scale(1.2)}}
.qcard{background:var(--w);color:var(--k);padding:22px 20px 24px;margin-bottom:20px;clip-path:var(--cut);animation:cardIn .4s cubic-bezier(.2,.8,.2,1)}
.qcard .tag{margin-bottom:12px}
.qcard h3{font-size:24px;font-weight:900;line-height:1.5}
.qcard .quote{margin-top:14px;background:var(--k);color:var(--w);padding:14px 16px;font-size:19px;font-weight:700;line-height:1.6;border-left:6px solid var(--o)}
.opts{display:grid;gap:12px}
.opts.tf{grid-template-columns:1fr 1fr;gap:14px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--k2);border:2px solid var(--w);padding:13px 14px;font-size:18px;font-weight:700;line-height:1.45;
  animation:slideIn .4s cubic-bezier(.2,.8,.2,1) both;transition:transform .08s,box-shadow .08s,background .15s,opacity .2s}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
.opt:hover{transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--o)}
.opt:active{transform:translate(2px,2px);box-shadow:none}
.opt .k{width:34px;height:34px;background:var(--w);color:var(--k);display:grid;place-items:center;font-family:var(--num);font-size:19px;flex:none;transform:skewX(-10deg)}
.opts.tf .opt{flex-direction:column;justify-content:center;text-align:center;padding:22px 10px 18px;gap:8px;font-size:20px;font-weight:900}
.opts.tf .opt .k{width:auto;height:auto;background:none;color:var(--w);transform:none;font-family:var(--font);font-size:52px;line-height:1;font-weight:900}
.opts.tf .opt:first-child .k{color:var(--w)}
.opts.tf .opt:last-child{background:var(--o);border-color:var(--o)}
.opt.dim{opacity:.25}
.opt.right{background:var(--w)!important;color:var(--k);border-color:var(--w)!important;box-shadow:6px 6px 0 var(--o)}
.opt.right .k{background:var(--o);color:var(--w)}
.opts.tf .opt.right .k{background:none;color:var(--o)}
.opt.wrong{animation:shake .4s;text-decoration:line-through;text-decoration-color:var(--o);text-decoration-thickness:3px}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

/* 印章 */
.stamp{position:fixed;left:50%;top:42%;z-index:45;pointer-events:none;opacity:0}
.stamp b{display:block;font-size:56px;font-weight:900;letter-spacing:.1em;padding:10px 22px 12px 32px;border:7px solid var(--o);color:var(--o);background:var(--k);position:relative;white-space:nowrap}
.stamp b::before{content:"";position:absolute;inset:5px;border:2px solid var(--o)}
.stamp.bad b{border-color:var(--w);color:var(--w)}
.stamp.bad b::before{border-color:var(--w)}
.stamp.go{animation:slam .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slam{0%{opacity:0;transform:translate(-50%,-50%) rotate(-24deg) scale(2.6)}22%{opacity:1;transform:translate(-50%,-50%) rotate(-10deg) scale(1)}75%{opacity:1;transform:translate(-50%,-50%) rotate(-10deg) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(-10deg) scale(.96)}}
.shakeScreen{animation:screenShake .25s}
@keyframes screenShake{30%{transform:translate(4px,-3px)}60%{transform:translate(-4px,3px)}}

/* 回饋面板 */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;transform:translateY(110%);transition:transform .38s cubic-bezier(.2,.9,.25,1)}
.fb.show{transform:none}
.fb .in{width:100%;max-width:480px;background:var(--o);color:var(--w);padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);clip-path:polygon(0 18px,100% 0,100% 100%,0 100%)}
.fb.bad .in{background:var(--w);color:var(--k)}
.fb .ttl{display:flex;align-items:center;gap:12px;font-size:28px;font-weight:900;padding-top:10px}
.fb .ttl .pts{margin-left:auto;font-family:var(--num);font-size:24px;background:var(--k);color:var(--w);padding:0 10px;transform:skewX(-10deg)}
.fb.bad .ttl .pts{display:none}
.fb .exp{font-size:17px;line-height:1.75;margin:10px 0 18px}
.fb .exp b{font-weight:900;box-shadow:inset 0 -.35em 0 rgba(14,13,12,.22)}
.fb.bad .exp b{box-shadow:inset 0 -.35em 0 rgba(235,77,0,.4)}
.fb .btn{background:var(--k);color:var(--w);box-shadow:6px 6px 0 var(--o-d)}
.fb.bad .btn{box-shadow:6px 6px 0 var(--o)}

/* 結算 */
.result{padding-top:5vh}
.result .seal{margin:0 auto;width:auto;height:auto;padding:14px 26px;background:var(--k);border-color:var(--w);color:var(--w)}
.result .seal::before{border-color:var(--w)}
.result .seal b{font-size:44px;letter-spacing:.1em}
.result h2{text-align:center;font-size:30px;font-weight:900;margin:30px 0 4px;line-height:1.35}
.result .sub{text-align:center;color:var(--w2);font-size:17px;line-height:1.7;margin-bottom:18px}
.starrow{display:flex;justify-content:center;gap:14px;margin:6px 0 4px}
.starrow span{font-size:56px;line-height:1;color:var(--k3);transform:scale(.4) rotate(-40deg);transition:all .45s cubic-bezier(.2,1.8,.4,1)}
.starrow span.on{color:var(--o);transform:none;text-shadow:4px 4px 0 var(--w)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 20px}
.stats div{background:var(--k2);border:2px solid var(--k3);padding:12px 8px;text-align:center}
.stats b{display:block;font-family:var(--num);font-size:34px;line-height:1.1;color:var(--o)}
.stats span{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--mute)}
.rankcard{background:var(--w);color:var(--k);padding:20px 22px;margin-bottom:24px;clip-path:var(--cut);position:relative}
.rankcard .tag{margin-bottom:8px}
.rankcard .nm{font-size:32px;font-weight:900;line-height:1.3}
.rankcard p{font-size:16px;color:#4a443d;line-height:1.7;margin-top:4px}
.rankcard .big{position:absolute;right:14px;bottom:4px;font-family:var(--num);font-size:84px;line-height:1;color:transparent;-webkit-text-stroke:2px var(--w2)}
.review{margin-bottom:24px}
.review h4{font-size:14px;font-weight:900;letter-spacing:.12em;color:var(--mute);margin-bottom:10px}
.review .it{background:var(--k2);border-left:5px solid var(--o);padding:14px 16px;margin-bottom:10px}
.review .it .q{font-size:16px;font-weight:900;line-height:1.55}
.review .it .a{font-size:15px;color:var(--o);margin-top:6px;font-weight:900}
.review .it .e{font-size:15px;color:var(--w2);margin-top:4px;line-height:1.7}

/* 倒數 */
.count{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:var(--o)}
.count.on{display:grid}
.count b{font-family:var(--num);font-size:200px;line-height:1;color:var(--k);animation:zoom .7s cubic-bezier(.2,1.4,.4,1)}
.count small{position:absolute;bottom:22%;left:0;right:0;text-align:center;font-weight:900;font-size:20px;letter-spacing:.3em;color:var(--k)}
@keyframes zoom{from{transform:scale(2.4) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}

canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:46}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.stamp{display:none}}

/* ====== 音效 ====== */
let AC;
function beep(type){
  if(!G.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t0=AC.currentTime;
    if(type==='swoosh'){
      const len=.3,buf=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
      const src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
      src.buffer=buf;f.type='bandpass';f.frequency.setValueAtTime(600,t0);f.frequency.exponentialRampToValueAtTime(3000,t0+len);g.gain.value=.12;
      src.connect(f).connect(g).connect(AC.destination);src.start();return;
    }
    const seq={ok:[[784,0],[1175,.08]],bad:[[196,0],[147,.12]],tap:[[600,0]],win:[[523,0],[659,.09],[784,.18],[1046,.27],[1318,.36]],tick:[[1000,0]],stamp:[[90,0]]}[type];
    seq.forEach(([fq,t])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type==='bad'||type==='stamp'?'square':'triangle';o.frequency.value=fq;
      const s=t0+t;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(type==='tick'?.04:.14,s+.015);g.gain.exponentialRampToValueAtTime(.0001,s+(type==='stamp'?.15:.22));
      o.connect(g).connect(AC.destination);o.start(s);o.stop(s+.25)});
  }catch(e){}
}

/* ====== 碎片特效（純色三角形） ====== */
const cv=$('fx'),cx=cv.getContext('2d');let parts=[],raf;
function burst(n){
  if(reduce)return;
  const dpr=devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
  const cols=['#eb4d00','#f4f1ea','#0e0d0c','#eb4d00'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=Math.random()*14+5;
    parts.push({x:innerWidth/2,y:innerHeight*.42,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,s:Math.random()*14+6,c:cols[i%4],r:Math.random()*6,vr:(Math.random()-.5)*.5,life:70+Math.random()*50})}
  cancelAnimationFrame(raf);(function loop(){
    cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
    parts=parts.filter(p=>p.life-->0);
    parts.forEach(p=>{p.vy+=.45;p.vx*=.97;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
      if(p.c==='#0e0d0c'){cx.strokeStyle='#f4f1ea';cx.lineWidth=1.5}
      cx.beginPath();cx.moveTo(0,-p.s/2);cx.lineTo(p.s/2,p.s/2);cx.lineTo(-p.s/2,p.s/3);cx.closePath();cx.fill();if(p.c==='#0e0d0c')cx.stroke();cx.restore()});
    if(parts.length)raf=requestAnimationFrame(loop);else cx.clearRect(0,0,innerWidth,innerHeight);
  })();
}
function stamp(text,bad){
  const s=$('stamp');$('stampT').textContent=text;s.classList.toggle('bad',!!bad);

  setTimeout(()=>{beep('stamp');const a=$('app');a.classList.remove('shakeScreen');void a.offsetWidth;a.classList.add('shakeScreen')},180);
}

let Q=[],qi=0,right=0,combo=0,maxCombo=0,score=0,mode='stage',wrongs=[],tmr,tleft,locked=false;
function prep(q,sid){
  if(q.t==='tf')return{...q,sid,opts:[{t:'可以發',k:'○',ok:q.a===0},{t:'踩雷了',k:'✕',ok:q.a===1}]};
  return{...q,sid,opts:shuffle(q.o.map((t,k)=>({t,ok:k===0})))};
}
function startStageQuiz(){
  mode='stage';const s=STAGES[cur];
  Q=shuffle(s.q).slice(0,5).map(q=>prep(q,s.id));
  begin();
}
function startFinal(){
  mode='final';
  let pool=[];STAGES.forEach(s=>pool.push(...shuffle(s.q).slice(0,3).map(q=>prep(q,s.id))));
  Q=shuffle(pool);
  const c=$('count');c.classList.add('on');let n=3;$('countN').textContent=n;beep('tick');
  const it=setInterval(()=>{n--;const b=$('countN');if(n>0){b.textContent=n}else if(n===0){b.textContent='GO'}else{clearInterval(it);c.classList.remove('on');begin(true);return}
    b.style.animation='none';void b.offsetWidth;b.style.animation='';beep(n===0?'stamp':'tick')},700);
}
function begin(instant){qi=0;right=0;combo=0;maxCombo=0;score=0;wrongs=[];
  $('timer').hidden=mode!=='final';$('scoreP').hidden=mode!=='final';$('scoreN').textContent=0;
  $('combo').textContent='';$('combo').classList.remove('show');
  show('sQuiz',instant);setTimeout(renderQ,instant?0:300)}
function renderQ(){
  locked=false;const q=Q[qi];
  $('qdots').innerHTML=Q.map((_,k)=>`<i class="${k<qi?'on':k===qi?'cur':''}"></i>`).join('');
  $('qcount').innerHTML=`${pad(qi+1)}<small> / ${pad(Q.length)}</small>`;
  $('qcard').innerHTML=`<span class="tag o"><span>${CATS[q.sid]}</span></span><h3>${q.q}</h3>${q.quote?`<div class="quote">「${q.quote}」</div>`:''}`;
  $('qcard').style.animation='none';void $('qcard').offsetWidth;$('qcard').style.animation='';
  const o=$('opts');o.className='opts'+(q.t==='tf'?' tf':'');
  o.innerHTML=q.opts.map((x,k)=>`<button class="opt" data-k="${k}"><span class="k">${q.t==='tf'?x.k:'ABCD'[k]}</span><span>${x.t}</span></button>`).join('');
  o.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  if(mode==='final'){clearInterval(tmr);tleft=20;tick();tmr=setInterval(()=>{tleft--;tick();if(tleft<=0){clearInterval(tmr);answer(-1)}},1000)}
}
function tick(){$('tnum').textContent=tleft;$('tf').style.strokeDashoffset=144.5*(1-tleft/20);$('timer').classList.toggle('low',tleft<=5);if(tleft<=5&&tleft>0)beep('tick')}
function answer(k){
  if(locked)return;locked=true;clearInterval(tmr);
  const q=Q[qi],btns=[...$('opts').children],ri=q.opts.findIndex(x=>x.ok),ok=k===ri;
  btns.forEach((b,i)=>{if(i===ri)b.classList.add('right');else if(i===k)b.classList.add('wrong');else b.classList.add('dim')});
  let pts=0;
  if(ok){right++;combo++;maxCombo=Math.max(maxCombo,combo);pts=100+(mode==='final'?tleft*5:0)+(combo>1?(combo-1)*20:0);score+=pts;beep('ok');
    stamp(combo>=3?combo+' 連對':'正解');burst(combo>=3?60:28)}
  else{combo=0;beep('bad');wrongs.push(q);stamp(k===-1?'時間到':'可惜',true);try{navigator.vibrate&&navigator.vibrate(100)}catch(e){}}
  $('scoreN').textContent=score;
  const cb=$('combo');cb.textContent=combo>1?combo+' COMBO':'';cb.classList.toggle('show',combo>1);
  $('fb').classList.toggle('bad',!ok);
  $('fbT').textContent=ok?['答對了！','太強了！','完全正確！','漂亮！'][Math.random()*4|0]:(k===-1?'時間到！':'差一點點！');
  $('fbP').textContent='+'+pts;
  $('fbE').innerHTML=(ok?'':'正確答案：<b>'+q.opts[ri].t+'</b><br>')+q.e;
  $('fbNext').innerHTML=(qi===Q.length-1?'看結果':'下一題')+'<span class="arr">→</span>';
  setTimeout(()=>$('fb').classList.add('show'),650);
}
$('fbNext').onclick=()=>{beep('tap');$('fb').classList.remove('show');qi++;if(qi<Q.length)setTimeout(renderQ,220);else setTimeout(mode==='final'?finalResult:stageResult,200)};
$('quizClose').onclick=()=>{clearInterval(tmr);$('fb').classList.remove('show');renderMap();show('sMap')};

function reviewHTML(list){
  if(!list.length)return'';
  return`<h4>答錯的題目，再看一次</h4>`+list.map(q=>`<div class="it"><div class="q">${q.q}${q.quote?'<br>「'+q.quote+'」':''}</div><div class="a">○ ${q.opts.find(x=>x.ok).t}</div><div class="e">${q.e}</div></div>`).join('');
}
function stageResult(){
  const s=STAGES[cur],n=Q.length,st=right===n?3:right>=n-1?2:right>=Math.ceil(n/2)?1:0;
  S.stars[s.id]=Math.max(S.stars[s.id]||0,st);save();pushScore();
  $('stSeal').textContent=st===3?'完美':st?'過關':'再來';
  $('stTitle').textContent=st===3?'完美過關！':st?'過關了！':'差一點，再試一次！';
  $('stSub').innerHTML=`答對 <b style="color:#eb4d00">${right} / ${n}</b> 題`+(st?'':'<br>答對一半以上就能過關');
  const ss=[...$('stStars').children];ss.forEach(x=>x.classList.remove('on'));
  ss.forEach((x,i)=>setTimeout(()=>{if(i<st){x.classList.add('on');beep('ok')}},700+i*280));
  $('stReview').innerHTML=reviewHTML(wrongs);
  const isLast=cur===STAGES.length-1;
  $('stNext').innerHTML=(st?(isLast?'挑戰熟成大考':'下一關'):'回到關卡')+'<span class="arr">→</span>';
  $('stNext').onclick=()=>{if(!st){renderMap();show('sMap')}else if(isLast){renderMap();startFinal()}else{startLearn(cur+1)}};
  $('stRetry').onclick=()=>{startStageQuiz()};
  show('sStage');if(st)setTimeout(()=>{burst(st*40);if(st===3)beep('win')},800);
}
function finalResult(){
  const n=Q.length;
  if(score>=(S.best||0)){S.best=score;S.right=right;S.total=n}
  S.lastScore=score;save();pushScore();
  const d=Math.round(right/n*28),r=rankOf(d);
  $('fRight').textContent=right+'/'+n;$('fScore').textContent=score;$('fCombo').textContent=maxCombo;
  $('fTitle').textContent=(S.name?S.name+'，':'')+'熟成大考完成！';
  $('fSub').textContent=right===n?'全部答對，太厲害了！':'答錯的題目都在下面，看完再挑戰一次吧';
  $('fRank').textContent=r[1];$('fMsg').textContent=r[2];$('fDay').textContent=pad(d);
  $('fReview').innerHTML=reviewHTML(wrongs);
  show('sFinal');setTimeout(()=>{burst(140);beep('win')},700);
}
$('fRetry').onclick=()=>startFinal();
$('fBoard').onclick=()=>openBoard('sFinal');
$('fMap').onclick=()=>{renderMap();show('sMap')};

document.addEventListener('keydown',e=>{
  if($('sQuiz').classList.contains('on')){
    if($('fb').classList.contains('show')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();$('fbNext').click()}
    else if(/^[1-4]$/.test(e.key)){const b=$('opts').children[+e.key-1];if(b)b.click()}
  }else if($('sLearn').classList.contains('on')){if(e.key==='ArrowRight'||e.key==='Enter')$('lNext').click();if(e.key==='ArrowLeft')$('lPrev').click()}
});
</script>
</body>
</html>
