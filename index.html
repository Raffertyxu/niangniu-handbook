<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1714">
<title>酿牛熟成學院</title>
<meta name="description" content="闖關學會酿牛和生活文，最後挑戰熟成大考。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&text=%E9%85%BF&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1d1714; --bg2:#2a211c; --panel:#fff8ef; --panel2:#f3e7d8; --ink:#241b16; --ink2:#5c4d43; --muted:#9a8a7d;
  --orange:#eb4d00; --orange-d:#b33a00; --gold:#ffbf3c; --gold-d:#d99512;
  --green:#22b866; --green-d:#178a4b; --red:#ef4444; --red-d:#b91c1c; --blue:#3b82f6; --blue-d:#1d4ed8;
  --purple:#8b5cf6; --purple-d:#6d28d9; --teal:#14b8a6; --teal-d:#0f766e; --pink:#f43f5e; --pink-d:#be123c;
  --font:"Noto Sans TC","Noto Sans SC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);overflow-x:hidden;
  background-image:radial-gradient(circle at 20% 0%,rgba(235,77,0,.28),transparent 45%),radial-gradient(circle at 100% 100%,rgba(255,191,60,.14),transparent 40%);
  background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px)}
.screen{display:none;flex:1;flex-direction:column;animation:enter .45s cubic-bezier(.2,.9,.3,1.2)}
.screen.on{display:flex}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}

/* 共用 */
.top{display:flex;align-items:center;gap:10px;padding:14px 0}
.iconbtn{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;font-size:18px;flex:none}
.iconbtn:active{transform:scale(.94)}
.pillstat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:8px 14px;font-weight:900;font-size:15px}
.grow{flex:1}
.btn{display:block;width:100%;border-radius:18px;padding:17px 20px;font-size:19px;font-weight:900;letter-spacing:.04em;color:#fff;background:var(--orange);
  box-shadow:0 6px 0 var(--orange-d);transition:transform .08s,box-shadow .08s;position:relative}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--orange-d)}
.btn.ghost{background:rgba(255,255,255,.1);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.btn.ghost:active{box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.gold{background:var(--gold);color:#3b2400;box-shadow:0 6px 0 var(--gold-d)}
.btn.gold:active{box-shadow:0 2px 0 var(--gold-d)}
.btn.green{background:var(--green);box-shadow:0 6px 0 var(--green-d)}
.btn+.btn{margin-top:14px}

/* 首頁 */
.home{justify-content:center;text-align:center;color:#fff;padding:24px 0}
.badge{display:inline-flex;gap:8px;align-items:center;align-self:center;background:rgba(255,255,255,.1);border-radius:999px;padding:7px 16px;font-size:14px;font-weight:700;color:var(--gold)}
.logo{margin:28px auto 8px;width:132px;height:132px;border-radius:40px;background:linear-gradient(145deg,var(--orange),#ff7a2e);display:grid;place-items:center;
  box-shadow:0 10px 0 var(--orange-d),0 24px 60px rgba(235,77,0,.45);transform:rotate(-6deg);animation:float 3.4s ease-in-out infinite}
.logo span{font-size:68px;font-weight:900;color:#fff;transform:rotate(6deg);text-shadow:0 4px 0 rgba(0,0,0,.18)}
@keyframes float{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(-3deg) translateY(-8px)}}
.home h1{font-size:44px;font-weight:900;line-height:1.15;margin-top:26px;letter-spacing:.02em}
.home h1 em{font-style:normal;color:var(--gold)}
.home p.lead{font-size:18px;line-height:1.7;color:rgba(255,255,255,.75);margin:14px auto 30px;max-width:20em}
.namebox{background:rgba(255,255,255,.08);border-radius:18px;padding:6px 6px 6px 18px;display:flex;align-items:center;gap:8px;margin-bottom:18px}
.namebox label{font-size:15px;color:rgba(255,255,255,.6);white-space:nowrap}
.namebox input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:18px;font-weight:700;padding:12px 0}
.namebox input::placeholder{color:rgba(255,255,255,.3)}
.homefoot{margin-top:22px;font-size:14px;color:rgba(255,255,255,.45)}

/* 地圖 */
.hello{color:#fff;padding:4px 2px 14px}
.hello h2{font-size:28px;font-weight:900;line-height:1.3}
.hello p{color:rgba(255,255,255,.65);font-size:16px;margin-top:4px}
.aging{background:var(--panel);border-radius:var(--r);padding:18px;margin-bottom:18px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.aging .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.aging b{font-size:15px;color:var(--ink2)}
.aging .day{font-size:28px;font-weight:900;color:var(--orange)}
.aging .day small{font-size:15px;color:var(--ink2);margin-left:2px}
.meter{height:16px;background:var(--panel2);border-radius:999px;overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#ff9a5a,var(--orange));border-radius:999px;transition:width .8s cubic-bezier(.2,.9,.3,1)}
.meter i::after{content:"";position:absolute;inset:3px 8px auto 8px;height:4px;border-radius:4px;background:rgba(255,255,255,.4)}
.aging .rank{margin-top:10px;font-size:15px;color:var(--ink2)}
.aging .rank b{color:var(--ink)}
.path{display:flex;flex-direction:column;gap:14px;padding-bottom:20px}
.stage{display:flex;align-items:center;gap:16px;background:var(--panel);border-radius:var(--r);padding:16px;text-align:left;box-shadow:0 7px 0 rgba(0,0,0,.28);transition:transform .1s;position:relative;width:100%}
.stage:active{transform:translateY(3px)}
.stage .ic{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;font-size:32px;flex:none;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.stage .no{font-size:13px;font-weight:900;letter-spacing:.1em;color:var(--muted)}
.stage .tt{font-size:20px;font-weight:900;line-height:1.3;color:var(--ink)}
.stage .st{font-size:14px;color:var(--ink2);margin-top:2px}
.stage .stars{margin-left:auto;font-size:15px;letter-spacing:1px;white-space:nowrap;flex:none}
.stage.locked{opacity:.5;filter:grayscale(.8)}
.stage.locked .stars::before{content:"🔒";font-size:20px}
.stage.final{background:linear-gradient(135deg,#ffcf5c,var(--gold));box-shadow:0 7px 0 var(--gold-d)}
.stage.final .no{color:#7a5000}
.stage.final .st{color:#5a3c00}
.stage.next::after{content:"開始";position:absolute;top:-10px;right:14px;background:var(--orange);color:#fff;font-size:12px;font-weight:900;padding:3px 10px;border-radius:999px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}

/* 學習卡 */
.dots{display:flex;gap:6px;flex:1}
.dots i{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden;position:relative}
.dots i.done::after{content:"";position:absolute;inset:0;background:var(--gold)}
.learn{flex:1;display:flex;flex-direction:column}
.lcard{flex:1;background:var(--panel);border-radius:28px;padding:28px 24px;display:flex;flex-direction:column;box-shadow:0 10px 0 rgba(0,0,0,.28);animation:pop .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.lcard .em{font-size:60px;line-height:1;margin-bottom:18px}
.lcard .kick{font-size:14px;font-weight:900;letter-spacing:.12em;color:var(--orange);margin-bottom:8px}
.lcard h3{font-size:30px;font-weight:900;line-height:1.35;color:var(--ink);margin-bottom:16px}
.lcard h3 mark{background:linear-gradient(transparent 55%,rgba(255,191,60,.6) 55%);color:inherit}
.lcard .body{font-size:18px;line-height:1.8;color:var(--ink2)}
.lcard .body b{color:var(--ink)}
.lcard .facts{display:grid;gap:10px;margin-top:6px}
.lcard .facts div{display:flex;gap:12px;align-items:center;background:var(--panel2);border-radius:16px;padding:12px 14px;font-size:17px;color:var(--ink)}
.lcard .facts div span:first-child{font-size:24px;flex:none;width:30px;text-align:center}
.lcard .facts div span:last-child{flex:1;min-width:0;line-height:1.5}
.lcard .facts div b{display:block;font-size:13px;color:var(--muted);font-weight:700}
.lcard .duo{display:grid;gap:10px;margin-top:4px}
.lcard .duo div{border-radius:16px;padding:14px 16px;font-size:17px;line-height:1.6}
.lcard .duo .no{background:#fde4e1;color:#8f2a1f}
.lcard .duo .ok{background:#dcf5e6;color:#155c34}
.lcard .duo div::before{display:block;font-size:12px;font-weight:900;letter-spacing:.1em;margin-bottom:4px}
.lcard .duo .no::before{content:"✗ 不要這樣"}
.lcard .duo .ok::before{content:"✓ 這樣寫"}
.lcard .post{background:#fff;border:2px solid var(--panel2);border-radius:18px;padding:16px;white-space:pre-line;font-size:17px;line-height:1.75;color:var(--ink)}
.lcard .tip{margin-top:auto;padding-top:18px;font-size:15px;color:var(--muted)}
.learnnav{display:flex;gap:12px;margin-top:20px}
.learnnav .btn{flex:1}
.learnnav .back{flex:0 0 64px;padding:17px 0}

/* 題目 */
.qhead{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:14px}
.qcount{font-weight:900;font-size:15px;color:rgba(255,255,255,.7)}
.combo{margin-left:auto;font-weight:900;color:var(--gold);font-size:15px;opacity:0;transition:opacity .2s}
.combo.show{opacity:1;animation:pulse .5s}
@keyframes pulse{50%{transform:scale(1.25)}}
.timer{position:relative;width:52px;height:52px;flex:none}
.timer svg{transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:6}
.timer .tb{stroke:rgba(255,255,255,.12)}
.timer .tf{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.timer.low .tf{stroke:var(--red)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:17px;font-weight:900}
.qcard{background:var(--panel);border-radius:28px;padding:24px 22px 26px;box-shadow:0 10px 0 rgba(0,0,0,.28);margin-bottom:18px;animation:pop .4s cubic-bezier(.2,.9,.3,1.3)}
.qcard .cat{display:inline-block;font-size:13px;font-weight:900;color:#fff;border-radius:999px;padding:4px 12px;margin-bottom:12px}
.qcard h3{font-size:24px;font-weight:900;line-height:1.5;color:var(--ink)}
.qcard .quote{margin-top:14px;background:var(--panel2);border-radius:16px;padding:14px 16px;font-size:19px;font-weight:700;line-height:1.6;color:var(--ink)}
.opts{display:grid;gap:12px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:18px;padding:15px 16px;font-size:18px;font-weight:700;line-height:1.45;color:#fff;transition:transform .08s,box-shadow .08s,opacity .2s}
.opt .k{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:16px;font-weight:900;flex:none}
.opt:active{transform:translateY(4px)}
.opt.c0{background:var(--blue);box-shadow:0 6px 0 var(--blue-d)}
.opt.c1{background:var(--purple);box-shadow:0 6px 0 var(--purple-d)}
.opt.c2{background:var(--teal);box-shadow:0 6px 0 var(--teal-d)}
.opt.c3{background:var(--pink);box-shadow:0 6px 0 var(--pink-d)}
.opts.tf .opt{flex-direction:column;justify-content:center;text-align:center;padding:22px 10px;font-size:20px;gap:6px}
.opts.tf .opt .k{width:auto;height:auto;background:none;font-size:38px}
.opts.tf .opt.c0{background:var(--green);box-shadow:0 6px 0 var(--green-d)}
.opts.tf .opt.c1{background:var(--red);box-shadow:0 6px 0 var(--red-d)}
.opt.dim{opacity:.35}
.opt.right{background:var(--green)!important;box-shadow:0 6px 0 var(--green-d)!important;animation:bounce .5s}
.opt.wrong{background:var(--red)!important;box-shadow:0 6px 0 var(--red-d)!important;animation:shake .45s}
@keyframes bounce{40%{transform:scale(1.05)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* 回饋面板 */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.9,.3,1.1)}
.fb.show{transform:none}
.fb .in{width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 20px);background:#e7f8ee}
.fb.bad .in{background:#fde8e6}
.fb .ttl{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:900;color:var(--green-d)}
.fb.bad .ttl{color:var(--red-d)}
.fb .ttl .pts{margin-left:auto;font-size:16px;background:var(--green);color:#fff;border-radius:999px;padding:3px 12px}
.fb.bad .ttl .pts{display:none}
.fb .exp{font-size:17px;line-height:1.75;color:var(--ink);margin:10px 0 16px}
.fb .exp b{color:var(--ink)}
.fb .btn{background:var(--green);box-shadow:0 6px 0 var(--green-d)}
.fb.bad .btn{background:var(--red);box-shadow:0 6px 0 var(--red-d)}

/* 結算 */
.result{color:#fff;text-align:center;justify-content:center;padding:20px 0}
.result .big{font-size:76px;line-height:1;margin-bottom:6px;animation:pop .6s cubic-bezier(.2,.9,.3,1.5)}
.result h2{font-size:34px;font-weight:900;line-height:1.3}
.result .sub{color:rgba(255,255,255,.7);font-size:17px;margin:8px 0 22px;line-height:1.7}
.starrow{display:flex;justify-content:center;gap:10px;margin:14px 0 6px}
.starrow span{font-size:52px;filter:grayscale(1) brightness(.5);transform:scale(.6);transition:all .4s cubic-bezier(.2,.9,.3,1.6)}
.starrow span.on{filter:none;transform:scale(1)}
.scorebox{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:8px 0 22px}
.scorebox div{background:rgba(255,255,255,.08);border-radius:18px;padding:14px 6px}
.scorebox b{display:block;font-size:26px;font-weight:900;color:var(--gold)}
.scorebox span{font-size:13px;color:rgba(255,255,255,.6)}
.rankcard{background:var(--panel);color:var(--ink);border-radius:26px;padding:22px;margin:4px 0 22px;box-shadow:0 8px 0 rgba(0,0,0,.28)}
.rankcard .lv{font-size:14px;font-weight:900;color:var(--orange);letter-spacing:.1em}
.rankcard .nm{font-size:30px;font-weight:900;margin:4px 0}
.rankcard p{font-size:16px;color:var(--ink2);line-height:1.7}
.review{text-align:left;margin-bottom:22px}
.review h4{font-size:15px;color:rgba(255,255,255,.6);margin-bottom:10px}
.review .it{background:var(--panel);color:var(--ink);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.review .it .q{font-size:16px;font-weight:900;line-height:1.5}
.review .it .a{font-size:15px;color:var(--green-d);margin-top:6px;font-weight:700}
.review .it .e{font-size:15px;color:var(--ink2);margin-top:4px;line-height:1.65}

/* 倒數開場 */
.count{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(29,23,20,.92)}
.count.on{display:grid}
.count b{font-size:120px;font-weight:900;color:var(--gold);animation:zoom .8s ease-out}
@keyframes zoom{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}

canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:520px){.app{padding-top:20px}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="count" id="count"><b id="countN">3</b></div>

<div class="app">

<!-- 首頁 -->
<section class="screen home on" id="sHome">
  <span class="badge">🎮 新人闖關遊戲</span>
  <div class="logo"><span>酿</span></div>
  <h1>酿牛<br><em>熟成學院</em></h1>
  <p class="lead">5 個小關卡，玩完就懂酿牛、會寫生活文。最後挑戰熟成大考，看你熟成幾天！</p>
  <div class="namebox"><label for="name">你的名字</label><input id="name" maxlength="10" placeholder="輸入暱稱" autocomplete="off"></div>
  <button class="btn" id="goMap">開始闖關</button>
  <p class="homefoot">全程約 15 分鐘 · 答錯也沒關係，看解說就學會了</p>
</section>

<!-- 地圖 -->
<section class="screen" id="sMap">
  <div class="top">
    <button class="iconbtn" id="mapHome" aria-label="回首頁">⌂</button>
    <span class="grow"></span>
    <span class="pillstat">⭐ <span id="starTotal">0</span></span>
    <button class="iconbtn" id="sound" aria-label="音效開關">🔊</button>
  </div>
  <div class="hello"><h2 id="hiName">嗨，新同學</h2><p>一關一關來，每關先學再答題。</p></div>
  <div class="aging">
    <div class="row"><b>你的熟成進度</b><span class="day" id="dayNum">0<small>天</small></span></div>
    <div class="meter"><i id="dayBar"></i></div>
    <div class="rank">目前等級：<b id="rankNow">生肉新手</b></div>
  </div>
  <div class="path" id="path"></div>
</section>

<!-- 學習卡 -->
<section class="screen" id="sLearn">
  <div class="top">
    <button class="iconbtn" id="learnClose" aria-label="回地圖">✕</button>
    <div class="dots" id="dots"></div>
  </div>
  <div class="learn">
    <div id="lcard"></div>
    <div class="learnnav">
      <button class="btn ghost back" id="lPrev" aria-label="上一張">←</button>
      <button class="btn" id="lNext">下一張</button>
    </div>
  </div>
</section>

<!-- 答題 -->
<section class="screen" id="sQuiz">
  <div class="top">
    <button class="iconbtn" id="quizClose" aria-label="離開">✕</button>
    <div class="dots" id="qdots"></div>
  </div>
  <div class="qhead">
    <div class="timer" id="timer" hidden><svg width="52" height="52"><circle class="tb" cx="26" cy="26" r="22"/><circle class="tf" id="tf" cx="26" cy="26" r="22" stroke-dasharray="138.2" stroke-dashoffset="0"/></svg><b id="tnum">20</b></div>
    <span class="qcount" id="qcount"></span>
    <span class="combo" id="combo"></span>
    <span class="pillstat" id="scoreP" hidden>🔥 <span id="scoreN">0</span></span>
  </div>
  <div class="qcard" id="qcard"></div>
  <div class="opts" id="opts"></div>
</section>

<!-- 關卡結算 -->
<section class="screen result" id="sStage">
  <div class="big" id="stEmoji">🎉</div>
  <h2 id="stTitle">過關！</h2>
  <div class="starrow" id="stStars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
  <p class="sub" id="stSub"></p>
  <div class="review" id="stReview"></div>
  <button class="btn" id="stNext">下一關</button>
  <button class="btn ghost" id="stRetry">再玩一次這關</button>
</section>

<!-- 大考結算 -->
<section class="screen result" id="sFinal">
  <div class="big" id="fEmoji">🏆</div>
  <h2 id="fTitle">熟成大考完成！</h2>
  <p class="sub" id="fSub"></p>
  <div class="scorebox">
    <div><b id="fRight">0</b><span>答對</span></div>
    <div><b id="fScore">0</b><span>總分</span></div>
    <div><b id="fCombo">0</b><span>最高連對</span></div>
  </div>
  <div class="rankcard"><div class="lv" id="fLv"></div><div class="nm" id="fRank"></div><p id="fMsg"></p></div>
  <div class="review" id="fReview"></div>
  <button class="btn gold" id="fRetry">再挑戰一次</button>
  <button class="btn ghost" id="fMap">回到地圖</button>
</section>

</div>

const RANKS=[[0,'生肉新手','剛進熟成室，還有很多可以學！'],[7,'熟成第 7 天','開始有點味道了，再多玩幾次就更熟。'],[14,'熟成第 14 天','已經很有樣子，可以開始練習寫稿了。'],[21,'熟成第 21 天','外乾內嫩，風味出來了！'],[28,'熟成 28 天大師','完全熟成，你已經是酿牛生活文達人！']];

/* ====== 狀態 ====== */
const KEY='nn-academy-v1';
let S={name:'',stars:{},best:0,sound:true};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const totalStars=()=>STAGES.reduce((s,x)=>s+(S.stars[x.id]||0),0);
const days=()=>Math.round(totalStars()/(STAGES.length*3)*28);
const rankOf=d=>RANKS.filter(r=>d>=r[0]).pop();

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}

/* ====== 音效 ====== */
let AC;
function beep(type){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const seq={ok:[[660,.0],[880,.09]],bad:[[220,0],[180,.12]],tap:[[520,0]],win:[[523,0],[659,.1],[784,.2],[1046,.3]],tick:[[900,0]]}[type];
    seq.forEach(([f,t])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type==='bad'?'sawtooth':'triangle';o.frequency.value=f;
      const s=AC.currentTime+t;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(type==='tick'?.05:.18,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.22);
      o.connect(g).connect(AC.destination);o.start(s);o.stop(s+.25)});
  }catch(e){}
}

/* ====== 彩帶 ====== */
const cv=$('fx'),cx=cv.getContext('2d');let parts=[],raf;
function confetti(n){
  cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.scale(devicePixelRatio,devicePixelRatio);
  const cols=['#eb4d00','#ffbf3c','#22b866','#3b82f6','#8b5cf6','#f43f5e'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[i%6],a:Math.random()*6,va:(Math.random()-.5)*.4,life:120+Math.random()*60});
  cancelAnimationFrame(raf);(function loop(){
    cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
    parts=parts.filter(p=>p.life-->0);
    parts.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()});
    if(parts.length)raf=requestAnimationFrame(loop);else cx.clearRect(0,0,innerWidth,innerHeight);
  })();
}

/* ====== 首頁與地圖 ====== */
$('name').value=S.name||'';
$('goMap').onclick=()=>{S.name=$('name').value.trim();save();beep('tap');renderMap();show('sMap')};
$('mapHome').onclick=()=>show('sHome');
$('sound').onclick=()=>{S.sound=!S.sound;save();$('sound').textContent=S.sound?'🔊':'🔇';beep('tap')};
$('sound').textContent=S.sound?'🔊':'🔇';

function unlocked(i){return i===0||(S.stars[STAGES[i-1].id]||0)>0}
function renderMap(){
  $('hiName').textContent='嗨，'+(S.name||'新同學')+' 👋';
  $('starTotal').textContent=totalStars();
  const d=days();$('dayNum').innerHTML=d+'<small>天</small>';
  requestAnimationFrame(()=>$('dayBar').style.width=(d/28*100)+'%');
  $('rankNow').textContent=rankOf(d)[1];
  const p=$('path');p.innerHTML='';
  let nextMarked=false;
  STAGES.forEach((s,i)=>{
    const st=S.stars[s.id]||0,lock=!unlocked(i);
    const b=document.createElement('button');b.className='stage'+(lock?' locked':'');
    if(!lock&&!st&&!nextMarked){b.classList.add('next');nextMarked=true}
    b.innerHTML=`<span class="ic" style="background:${s.color}">${s.icon}</span><span><span class="no">${s.no}</span><span class="tt" style="display:block">${s.title}</span><span class="st" style="display:block">${s.sub}</span></span><span class="stars">${lock?'':'⭐'.repeat(st)+'<span style="opacity:.25">'+'⭐'.repeat(3-st)+'</span>'}</span>`;
    b.onclick=()=>{if(lock){beep('bad');b.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:300});return}beep('tap');startLearn(i)};
    p.appendChild(b);
  });
  const allDone=STAGES.every(s=>(S.stars[s.id]||0)>0);
  const f=document.createElement('button');f.className='stage final'+(allDone?'':' locked')+(allDone&&!S.best&&!nextMarked?' next':'');
  f.innerHTML=`<span class="ic" style="background:#fff3d1">🏆</span><span><span class="no">最終挑戰</span><span class="tt" style="display:block">熟成大考</span><span class="st" style="display:block">15 題限時搶答${S.best?' · 最佳 '+S.best+' 分':''}</span></span><span class="stars"></span>`;
  f.onclick=()=>{if(!allDone){beep('bad');return}beep('tap');startFinal()};
  p.appendChild(f);
}

/* ====== 學習卡 ====== */
let cur=0,card=0;
function startLearn(i){cur=i;card=0;renderCard();show('sLearn')}
function renderCard(){
  const s=STAGES[cur],c=s.cards[card];
  $('dots').innerHTML=s.cards.map((_,k)=>`<i class="${k<=card?'done':''}"></i>`).join('');
  let h=`<div class="lcard"><div class="em">${c.em}</div><div class="kick">${c.kick}</div><h3>${c.h}</h3>`;
  if(c.body)h+=`<div class="body">${c.body}</div>`;
  if(c.facts)h+=`<div class="facts">${c.facts.map(f=>`<div><span>${f[0]}</span><span><b>${f[1]}</b>${f[2]==='—'?'':f[2]}</span></div>`).join('')}</div>`;
  if(c.duo)h+=`<div class="duo">${c.duo.map(d=>`<div class="no">${d[0]}</div><div class="ok">${d[1]}</div>`).join('')}</div>`;
  if(c.post)h+=`<div class="post">${c.post}</div>`;
  if(c.tip)h+=`<div class="tip">💡 ${c.tip}</div>`;
  $('lcard').innerHTML=h+'</div>';
  $('lPrev').style.visibility=card?'visible':'hidden';
  const last=card===s.cards.length-1;
  $('lNext').textContent=last?'學會了，開始答題！':'下一張';
  $('lNext').className='btn'+(last?' gold':'');
}
$('lNext').onclick=()=>{beep('tap');const s=STAGES[cur];if(card<s.cards.length-1){card++;renderCard()}else startStageQuiz()};
$('lPrev').onclick=()=>{if(card){card--;renderCard()}};
$('learnClose').onclick=()=>{renderMap();show('sMap')};

/* ====== 答題 ====== */
let Q=[],qi=0,right=0,combo=0,maxCombo=0,score=0,mode='stage',wrongs=[],tmr,tleft,locked=false;
const CATS={s1:['酿牛是誰','#eb4d00'],s2:['熟成知識','#3b82f6'],s3:['行銷重點','#8b5cf6'],s4:['寫作技巧','#16a34a'],s5:['紅線判斷','#ef4444']};
function prep(q,sid){
  if(q.t==='tf')return{...q,sid,opts:[{t:'可以發',k:'👍',ok:q.a===0},{t:'踩雷了',k:'💥',ok:q.a===1}]};
  return{...q,sid,opts:shuffle(q.o.map((t,k)=>({t,ok:k===0})))};
}
function startStageQuiz(){
  mode='stage';const s=STAGES[cur];
  Q=shuffle(s.q).slice(0,5).map(q=>prep(q,s.id));
  begin();
}
function startFinal(){
  mode='final';
  let pool=[];STAGES.forEach(s=>pool.push(...shuffle(s.q).slice(0,3).map(q=>prep(q,s.id))));
  Q=shuffle(pool);
  const c=$('count');c.classList.add('on');let n=3;$('countN').textContent=n;beep('tick');
  const it=setInterval(()=>{n--;if(n>0){$('countN').textContent=n;$('countN').style.animation='none';void $('countN').offsetWidth;$('countN').style.animation='';beep('tick')}else{clearInterval(it);c.classList.remove('on');begin()}},800);
}
function begin(){qi=0;right=0;combo=0;maxCombo=0;score=0;wrongs=[];
  $('timer').hidden=mode!=='final';$('scoreP').hidden=mode!=='final';$('scoreN').textContent=0;
  $('combo').textContent='';$('combo').classList.remove('show');
  show('sQuiz');renderQ()}
function renderQ(){
  locked=false;const q=Q[qi];
  $('qdots').innerHTML=Q.map((_,k)=>`<i class="${k<qi?'done':''}"></i>`).join('');
  $('qcount').textContent=`第 ${qi+1} / ${Q.length} 題`;
  const cat=CATS[q.sid];
  $('qcard').innerHTML=`<span class="cat" style="background:${cat[1]}">${cat[0]}</span><h3>${q.q}</h3>${q.quote?`<div class="quote">「${q.quote}」</div>`:''}`;
  $('qcard').style.animation='none';void $('qcard').offsetWidth;$('qcard').style.animation='';
  const o=$('opts');o.className='opts'+(q.t==='tf'?' tf':'');
  o.innerHTML=q.opts.map((x,k)=>`<button class="opt c${k}" data-k="${k}"><span class="k">${q.t==='tf'?x.k:'ABCD'[k]}</span><span>${x.t}</span></button>`).join('');
  o.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  if(mode==='final'){clearInterval(tmr);tleft=20;tick();tmr=setInterval(()=>{tleft--;tick();if(tleft<=0){clearInterval(tmr);answer(-1)}},1000)}
}
function tick(){$('tnum').textContent=tleft;$('tf').style.strokeDashoffset=138.2*(1-tleft/20);$('timer').classList.toggle('low',tleft<=5);if(tleft<=5&&tleft>0)beep('tick')}
function answer(k){
  if(locked)return;locked=true;clearInterval(tmr);
  const q=Q[qi],btns=[...$('opts').children],ri=q.opts.findIndex(x=>x.ok),ok=k===ri;
  btns.forEach((b,i)=>{if(i===ri)b.classList.add('right');else if(i===k)b.classList.add('wrong');else b.classList.add('dim')});
  let pts=0;
  if(ok){right++;combo++;maxCombo=Math.max(maxCombo,combo);pts=100+(mode==='final'?tleft*5:0)+(combo>1?(combo-1)*20:0);score+=pts;beep('ok');
    if(combo>=3)confetti(30)}
  else{combo=0;beep('bad');wrongs.push(q);if(navigator.vibrate)try{navigator.vibrate(120)}catch(e){}}
  $('scoreN').textContent=score;
  const cb=$('combo');cb.textContent=combo>1?`🔥 ${combo} 連對`:'';cb.classList.toggle('show',combo>1);
  const fb=$('fb');fb.classList.toggle('bad',!ok);
  $('fbT').textContent=ok?['答對了！','太強了！','完全正確！','漂亮！'][Math.random()*4|0]:(k===-1?'時間到！':'差一點點！');
  $('fbP').textContent='+'+pts;
  $('fbE').innerHTML=(ok?'':'正確答案：<b>'+q.opts[ri].t+'</b><br>')+q.e;
  $('fbNext').textContent=qi===Q.length-1?'看結果':'下一題';
  setTimeout(()=>fb.classList.add('show'),350);
}
$('fbNext').onclick=()=>{beep('tap');$('fb').classList.remove('show');qi++;if(qi<Q.length)setTimeout(renderQ,200);else setTimeout(mode==='final'?finalResult:stageResult,250)};
$('quizClose').onclick=()=>{clearInterval(tmr);$('fb').classList.remove('show');renderMap();show('sMap')};

function reviewHTML(list){
  if(!list.length)return'';
  return`<h4>📒 答錯的題目，再看一次</h4>`+list.map(q=>`<div class="it"><div class="q">${q.q}${q.quote?'<br>「'+q.quote+'」':''}</div><div class="a">✓ ${q.opts.find(x=>x.ok).t}</div><div class="e">${q.e}</div></div>`).join('');
}
function stageResult(){
  const s=STAGES[cur],n=Q.length,st=right===n?3:right>=n-1?2:right>=Math.ceil(n/2)?1:0;
  S.stars[s.id]=Math.max(S.stars[s.id]||0,st);save();
  $('stEmoji').textContent=st===3?'🎉':st?'👏':'💪';
  $('stTitle').textContent=st===3?'完美過關！':st?'過關了！':'差一點，再試一次！';
  $('stSub').innerHTML=`答對 <b style="color:#ffbf3c">${right} / ${n}</b> 題`+(st?'':'<br>答對一半以上就能過關');
  const ss=[...$('stStars').children];ss.forEach(x=>x.classList.remove('on'));
  ss.forEach((x,i)=>setTimeout(()=>{if(i<st){x.classList.add('on');beep('ok')}},400+i*300));
  $('stReview').innerHTML=reviewHTML(wrongs);
  const isLast=cur===STAGES.length-1;
  $('stNext').textContent=st?(isLast?'挑戰熟成大考 🏆':'下一關'):'回到地圖';
  $('stNext').onclick=()=>{beep('tap');if(!st){renderMap();show('sMap')}else if(isLast){renderMap();startFinal()}else{startLearn(cur+1)}};
  $('stRetry').onclick=()=>{beep('tap');startStageQuiz()};
  show('sStage');if(st)setTimeout(()=>{confetti(st*40);if(st===3)beep('win')},500);
}
function finalResult(){
  S.best=Math.max(S.best||0,score);save();
  const n=Q.length,d=Math.round(right/n*28),r=rankOf(d);
  $('fRight').textContent=right+'/'+n;$('fScore').textContent=score;$('fCombo').textContent=maxCombo;
  $('fEmoji').textContent=d>=28?'🏆':d>=21?'🥇':d>=14?'🥈':'🥉';
  $('fTitle').textContent=(S.name?S.name+'，':'')+'熟成大考完成！';
  $('fSub').textContent=right===n?'全部答對，太厲害了！':'答錯的題目都在下面，看完再挑戰一次吧';
  $('fLv').textContent='你的熟成等級';$('fRank').textContent=r[1];$('fMsg').textContent=r[2];
  $('fReview').innerHTML=reviewHTML(wrongs);
  show('sFinal');setTimeout(()=>{confetti(160);beep('win')},300);
}
$('fRetry').onclick=()=>{beep('tap');startFinal()};
$('fMap').onclick=()=>{renderMap();show('sMap')};

document.addEventListener('keydown',e=>{
  if($('sQuiz').classList.contains('on')){
    if($('fb').classList.contains('show')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();$('fbNext').click()}
    else if(/^[1-4]$/.test(e.key)){const b=$('opts').children[+e.key-1];if(b)b.click()}
  }else if($('sLearn').classList.contains('on')){if(e.key==='ArrowRight'||e.key==='Enter')$('lNext').click();if(e.key==='ArrowLeft')$('lPrev').click()}
});
</script>
</body>
